<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 둥근 사각형 배경 (격자무늬) -->
  <rect width="100" height="100" rx="22" fill="#f5f0e8"/>
  <!-- 격자 패턴 -->
  <line x1="0" y1="20" x2="100" y2="20" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="0" y1="40" x2="100" y2="40" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="0" y1="60" x2="100" y2="60" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="0" y1="80" x2="100" y2="80" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="20" y1="0" x2="20" y2="100" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="40" y1="0" x2="40" y2="100" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="60" y1="0" x2="60" y2="100" stroke="#e0d8cc" stroke-width="0.8"/>
  <line x1="80" y1="0" x2="80" y2="100" stroke="#e0d8cc" stroke-width="0.8"/>
  <!-- 외곽 원 (점선) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="3,3"/>
  <!-- 중간 원 -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- 수평선 (주황) -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#e05a3a" stroke-width="2.5"/>
  <!-- 심박수 파형 (주황) -->
  <polyline points="20,50 30,50 35,38 38,62 42,38 46,50 54,50 58,42 62,50 80,50"
    fill="none" stroke="#e05a3a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 중앙 점 -->
  <circle cx="50" cy="50" r="3.5" fill="#1a1a1a"/>
  <!-- 조준 십자선 (상하) -->
  <line x1="50" y1="10" x2="50" y2="22" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="50" y1="78" x2="50" y2="90" stroke="#1a1a1a" stroke-width="2"/>
</svg>
